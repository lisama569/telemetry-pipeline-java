spring.application.name=telemetry-pipeline-java

# Rolling window aggregation
telemetry.window-size-millis=10000
telemetry.window-count=6
telemetry.max-dimensions=100

# Error-rate alert with hysteresis
telemetry.error-rate-trigger=0.5
telemetry.error-rate-recover=0.3
telemetry.trigger-windows=2
telemetry.recover-windows=2

# Window finalization (idle completion, late-event grace)
telemetry.finalization-delay-millis=0
telemetry.late-grace-millis=0
telemetry.finalization-interval-millis=1000
